<!-- @dsCard height=288 -->
<div class="cv">
  <style>
    .cv { position: relative; width: 960px; height: 288px; background: var(--canvas-soft); overflow: hidden; font-family: var(--font-sans); }
    .cv svg { position: absolute; inset: 0; }
    .b-secondary { fill: var(--secondary); }
    .b-primary { fill: var(--primary); }
    .b-purple { fill: var(--accent-purple); }
    .d-orange { fill: var(--accent-orange); }
    .d-purple { fill: var(--accent-purple); }
    .p-on { fill: var(--on-primary); }
    .slab { rx: var(--radius-xl); }
    .cv-text { position: absolute; left: 24px; top: 168px; max-width: 600px; }
    .cv-name { margin: 0; font-size: 64px; line-height: 0.95; font-weight: 700; letter-spacing: 0.01em; color: var(--ink); white-space: nowrap; }
    .cv-tag { margin: 14px 0 0; font-size: 14px; letter-spacing: 0.04em; color: var(--ink-muted); }
  </style>
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: secondary 420x112, primary 228x112, accent-purple 248x112 (heights = space-lg x4 + space-xs x2), corners radius-xl -->
    <!-- arrangement: top-band skeleton (name too wide for the 440px zone), three flush slabs in a strip, gap space-xs -->
    <!-- pattern: discs and pills (radius-full) - the system's category dots and pill badges; the README keeps colour to small dots -->
    <!-- steps: inset space-lg 24, gap space-xs 8, disc pitch space-xl 28, disc d 16 (r 8), pill h 24 (rx 12) -->
    <rect class="b-secondary slab" x="24" y="24" width="420" height="112"></rect>
    <rect class="b-primary slab" x="452" y="24" width="228" height="112"></rect>
    <rect class="b-purple slab" x="688" y="24" width="248" height="112"></rect>
    <circle class="d-orange" cx="56" cy="104" r="8"></circle>
    <circle class="d-purple" cx="84" cy="104" r="8"></circle>
    <circle class="d-orange" cx="112" cy="104" r="8"></circle>
    <circle class="d-purple" cx="140" cy="104" r="8"></circle>
    <rect class="p-on" x="476" y="48" width="96" height="24" rx="12"></rect>
    <rect class="p-on" x="476" y="80" width="140" height="24" rx="12"></rect>
  </svg>
  <div class="cv-text">
    <p class="cv-name">提案資料デザイン</p>
    <p class="cv-tag">取引先に向けた提案資料・調査報告のためのデザイン体系</p>
  </div>
</div>
<script>(function(){var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap";document.head.appendChild(l);})();</script>
